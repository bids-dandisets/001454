description: 'This dandiset contains the data used in the manuscript: Patel RR, Patarino
  M, Kim K, Pamintuan R, Taschbach FH, Li H, Lee CR, van Hoek A, Castro R, Cazares
  C, Miranda RL, Jia C, Delahanty J, Batra K, Keyes LR, Libster A, Wichmann R, Pereira
